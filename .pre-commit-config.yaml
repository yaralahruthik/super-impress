repos:
  # Backend hooks (ultracite)
  - repo: local
    hooks:
      - id: ultracite-backend
        name: ultracite check (backend)
        entry: bun --cwd backend run check
        language: system
        pass_filenames: false
        files: ^backend/
        types: [file]
        types_or: [javascript, jsx, ts, tsx, json, css]

  # Frontend hooks (ultracite)
  - repo: local
    hooks:
      - id: ultracite-frontend
        name: ultracite check (frontend)
        entry: bun --cwd frontend run check
        language: system
        pass_filenames: false
        files: ^frontend/
        types: [file]
        types_or: [javascript, jsx, ts, tsx, json, css]

  # Docs hooks (ultracite)
  - repo: local
    hooks:
      - id: ultracite-docs
        name: ultracite check (docs)
        entry: bun --cwd docs run check
        language: system
        pass_filenames: false
        files: ^docs/
        types: [file]
        types_or: [javascript, jsx, ts, tsx, json, css]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
