repos:
  # Backend hooks (Biome)
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off
        language: system
        types: [text]
        files: ^backend/

  # Frontend hooks (Prettier & ESLint)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm -C frontend format
        language: system
        pass_filenames: false
        types_or: [css, javascript, jsx, ts, tsx, json, html, yaml, markdown]
        files: ^frontend/

      - id: eslint-frontend
        name: eslint (frontend)
        entry: pnpm -C frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
        types: [file]
        types_or: [javascript, jsx, ts, tsx]

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
