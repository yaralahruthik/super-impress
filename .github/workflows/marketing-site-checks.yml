name: Marketing Site Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "marketing-site/**"

jobs:
  marketing-site-checks:
    name: Marketing Site Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: marketing-site

      - name: Check Formatting & Linting
        run: bun run check
        working-directory: marketing-site

      - name: Build
        run: bun run build
        working-directory: marketing-site
